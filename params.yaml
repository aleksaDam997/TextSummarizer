TrainingArguments:
  output_dir: /kaggle/working/pegasus-lora
  num_train_epochs: 1
  per_device_train_batch_size: 2      # manji batch za stabilnost
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 3e-5                 # FIX: manji LR (1e-4 → 3e-5)
  warmup_ratio: 0.05                  # FIX: ratio umjesto steps, sigurniji
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: False                         # FIX: isključen fp16
  bf16: False
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 500
  save_total_limit: 2
  predict_with_generate: True
  generation_max_length: 128
  report_to: none
  remove_unused_columns: False
  label_names: labels
  ddp_find_unused_parameters: False
  dataloader_num_workers: 2

Lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
    - fc1
    - fc2
  lora_dropout: 0.05
  bias: "none"
  task_type: "SEQ_2_SEQ_LM"